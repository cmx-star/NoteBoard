name: macOS and Linux packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # 每个平台在对应系统上构建，避免在 Windows 伪造不可运行的 macOS / Linux 安装包。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Ubuntu 22.04 是 WebKitGTK 4.1 的较低支持基线；AppImage 在此环境产出。
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libfontconfig1-dev
      - run: pnpm install --frozen-lockfile
      # Tauri 打 AppImage 时才从 GitHub 下载 linuxdeploy 等工具，偶发 504 且不重试（0.8.0 曾因此失败）；
      # 预先下载到其缓存目录 ~/.cache/tauri，已存在时打包直接复用。先写临时文件再改名，避免残缺文件被当作已下载
      - name: Prefetch AppImage tools
        if: runner.os == 'Linux'
        run: |
          TOOLS="${HOME}/.cache/tauri"
          mkdir -p "${TOOLS}"
          fetch() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o "${TOOLS}/$1.part" "$2" \
              && chmod +x "${TOOLS}/$1.part" && mv "${TOOLS}/$1.part" "${TOOLS}/$1"
          }
          fetch AppRun-x86_64 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          fetch linuxdeploy-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          fetch linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          fetch linuxdeploy-plugin-gstreamer.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          # 该插件 Tauri 也视为可选，下载失败时回退内置版本
          fetch linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            || echo "::warning title=AppImage 插件::下载失败，打包时使用内置版本"
      - name: Build package
        env:
          # 未配置 Apple 开发者证书时使用 ad-hoc 签名，不宣称已通过 Apple 公证。
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
          # macOS 运行器上 Node 默认堆上限约 2 GB，前端打包已接近上限，放宽以免偶发内存溢出
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v6
        with:
          name: Loomark-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # 标签发布时等待原有 Windows 工作流创建 Release，再添加 Unix 安装包。
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          # 等待超时或上传失败都要让任务失败，find -exec 会吞掉子命令的错误
          gh release view "$RELEASE_TAG" >/dev/null
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
            | xargs -0 -r -n1 gh release upload "$RELEASE_TAG" --clobber

  # Unix 安装包上传后补充同步到腾讯云 CNB 镜像（已同步的 Windows / 安卓附件按哈希跳过）。
  sync-cnb:
    name: Sync release to CNB
    needs: package
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    uses: ./.github/workflows/cnb-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
